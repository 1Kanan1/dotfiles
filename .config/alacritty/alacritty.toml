[general]
import = [
  "~/.config/alacritty/keybindings.toml",
  "~/.config/alacritty/themes/themes/tokyo_night.toml"
]
live_config_reload = true

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
style = "Block"
unfocused_hollow = true

[debug]
log_level = "Warn"
persistent_logging = false
print_events = false
render_timer = false

[env]
SHELL = "/opt/homebrew/bin/fish"
TERM = "xterm-256color"

[font]
# size = 13.3
size = 14.5

[font.glyph_offset]
x = 0
y = 0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[window]
blur = false # true
decorations = "full"
dynamic_padding = true
opacity = 0.85
startup_mode = "Windowed"

[window.dimensions]
columns = 100
lines = 30

[window.padding]
x = 2
y = 0
